[project]
name = "horae"
dynamic = ["version"]
description = "Core runtime, CLI, HTTP API, MCP server and SDK for Horae, a predictable self-hosted personal agent."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17,<1.18",
    "httpx2>=2.16,<3",
    "mcp>=2.3,<2.4",
    "pydantic>=2.14",
    "pyyaml>=6",
    "typer>=0.27",
    "tzdata>=2026.5",
    "jsonschema>=4.26,<4.27",
    "referencing>=0.35",
    "cronsim>=2.7,<3",
    "fastapi>=0.161,<0.162",
    "uvicorn>=0.54,<0.55",
    "starlette>=1.9,<2",
]

[project.scripts]
horae = "horae.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/horae/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/horae"]

[tool.hatch.build.targets.sdist]
include = ["/src/horae", "/tests", "/examples", "/README.md", "/LICENSE"]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-cov>=7",
    "jsonschema[format-nongpl]>=4.26,<4.27",
    "types-pyyaml>=6",
    "types-jsonschema>=4.23",
    "regex>=2024.11",
    "types-regex>=2024.11",
    "ruff>=0.17",
    "hypothesis>=6.100",
    "horae-sdk",
]

# The plugin SDK (`sdk/`, published as `horae-sdk`) is a workspace member: one lock, and the
# core's lint, types and tests cover it. Coverage is gated per package (below).
[tool.uv.workspace]
members = ["sdk"]

[tool.uv.sources]
horae-sdk = { workspace = true }

[tool.uv]
required-version = ">=0.13"
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "sdk/src", "sdk/tests", "sdk/examples"]
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"sdk/tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "sdk/src", "sdk/tests", "sdk/examples"]
python_version = "3.12"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests", "sdk/tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
markers = [
    "live: runs against a real external program (e.g. Claude Code); skipped unless enabled, never in CI",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["horae", "horae_sdk"]
branch = true

# Both packages are measured, but the report (and the 85% gate of `pytest --cov`) is the core's
# alone, so the SDK's tests cannot carry it. CI gates the SDK separately on the same data:
# `coverage report --include='sdk/src/horae_sdk/*' --fail-under=85`.
[tool.coverage.report]
include = ["src/horae/*"]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
