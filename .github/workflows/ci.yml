name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  UV_PYTHON_PREFERENCE: only-managed
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: 0.13.6

jobs:
  lock:
    name: Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true
      - run: uv lock --check

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true
      - run: uv sync
      - run: uv run mypy

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true
      - run: uv sync
      # The coverage gate comes from [tool.coverage.report] in pyproject.toml: 85% of the core
      # alone (src/horae). The SDK (horae-sdk) gets its own 85% gate on the same data.
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Coverage gate of the SDK (horae_sdk alone)
        run: uv run coverage report --include='sdk/src/horae_sdk/*' --fail-under=85
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  sdk:
    name: SDK package (horae-sdk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true
      # Lint, types and tests of sdk/ run in the jobs above (a uv workspace member); this
      # checks the package builds as it would be published (Release SDK workflow).
      - run: uv build --package horae-sdk --out-dir dist
      - name: Check the wheel
        run: |
          set -euo pipefail
          python3 -m zipfile -l dist/horae_sdk-*.whl | tee "${RUNNER_TEMP}/wheel.txt"
          grep -q 'horae_sdk/py.typed' "${RUNNER_TEMP}/wheel.txt"
          grep -q 'licenses/LICENSE' "${RUNNER_TEMP}/wheel.txt"
      - name: "Check the sdist (no tests: they need the core)"
        run: |
          set -euo pipefail
          tar -tzf dist/horae_sdk-*.tar.gz | tee "${RUNNER_TEMP}/sdist.txt"
          grep -q '/src/horae_sdk/py.typed$' "${RUNNER_TEMP}/sdist.txt"
          if grep -q '/tests/' "${RUNNER_TEMP}/sdist.txt"; then
            echo "the sdist holds tests" >&2
            exit 1
          fi

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      security-events: write # upload SARIF
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the upstream checksums file
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
      - name: Scan full git history
        run: |
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --verbose \
            --log-opts="--full-history HEAD" \
            --report-format sarif --report-path "${RUNNER_TEMP}/gitleaks.sarif" .
      - name: Upload SARIF
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/gitleaks.sarif
          category: gitleaks

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      security-events: write # upload CodeQL results
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  image:
    name: Image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout only: this job runs PR code and gets no write token, nothing is pushed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Native amd64 only. The GitHub Actions cache is scoped by ref: a pull request reads the
      # default branch's cache and writes its own, which main never reads.
      - name: Build (loaded into the local Docker daemon, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: horae:smoke
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=image-linux-amd64
          cache-to: type=gha,scope=image-linux-amd64,mode=${{ github.ref == 'refs/heads/main' && 'max' || 'min' }}
      - name: Smoke test (non-root, read-only root filesystem, tmpfs, no network)
        run: scripts/smoke-image.sh horae:smoke

  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [lock, lint, types, test, sdk, gitleaks, codeql, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "${NEEDS}" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # Publishing lives here rather than in a workflow_run-triggered workflow: it runs only after
  # CI OK passed for this very commit and event, it checks out exactly github.sha, and no
  # cross-workflow trust (artifacts or head_sha of another run) is involved. It never runs on
  # pull requests. Release tags are handled by image.yml, which only adds tags to the digest
  # built, tested and signed here.
  publish:
    name: Image (publish, sign, verify)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [ci-ok]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # checkout; read the tip of main
      packages: write # push to ghcr.io/horae-dev/horae
      id-token: write # keyless cosign signing (sigstore OIDC)
    env:
      IMAGE: ghcr.io/horae-dev/horae
      # The signing identity; keep in sync with image.yml and docs/operations/container-image.md.
      SIGNER: https://github.com/horae-dev/horae/.github/workflows/ci.yml@refs/heads/main
      # renovate: datasource=github-releases depName=sigstore/cosign
      COSIGN_VERSION: 3.1.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v${{ env.COSIGN_VERSION }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package version, and whether this commit is still the tip of main
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/horae/__init__.py)"
          test -n "${version}"
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          # Re-running an older commit's workflow publishes its sha- tag but never moves edge back.
          if [ "${tip}" = "${GITHUB_SHA}" ]; then is_tip=true; else is_tip=false; fi
          echo "is-tip=${is_tip}" >> "${GITHUB_OUTPUT}"
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=edge,branch=main,enable=${{ steps.src.outputs.is-tip == 'true' }}
            type=sha,format=short,prefix=sha-,enable={{is_default_branch}}
      # Each platform is built, loaded and smoke-tested (arm64 under QEMU) before anything is
      # pushed. The push reuses these layers from the builder's cache, and the step after it
      # checks that the pushed filesystems are the tested ones.
      - name: Build linux/amd64 (loaded, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: horae:candidate-amd64
          build-args: |
            VERSION=${{ steps.src.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=image-linux-amd64
          cache-to: type=gha,scope=image-linux-amd64,mode=max
      - name: Smoke test linux/amd64
        run: scripts/smoke-image.sh horae:candidate-amd64 linux/amd64
      - name: Build linux/arm64 (loaded, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: horae:candidate-arm64
          build-args: |
            VERSION=${{ steps.src.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=image-linux-arm64
          cache-to: type=gha,scope=image-linux-arm64,mode=max
      - name: Smoke test linux/arm64 (QEMU)
        run: scripts/smoke-image.sh horae:candidate-arm64 linux/arm64
      - name: Push by digest, untagged (SBOM and provenance attached)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.src.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=image-linux-amd64
            type=gha,scope=image-linux-arm64
          sbom: true
          provenance: mode=max
      - name: The pushed filesystems are the smoke-tested ones
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          pushed="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{ json .Image }}')"
          for arch in amd64 arm64; do
            tested="$(docker image inspect "horae:candidate-${arch}" --format '{{ json .RootFS.Layers }}' | jq -c .)"
            published="$(jq -c --arg p "linux/${arch}" '.[$p].rootfs.diff_ids' <<< "${pushed}")"
            if [ "${tested}" != "${published}" ]; then
              echo "linux/${arch}: the pushed layers differ from the smoke-tested image" >&2
              exit 1
            fi
          done
          echo "${IMAGE}@${DIGEST}: same layers as the smoke-tested amd64 and arm64 images"
      - name: Verify the SBOM of every platform
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{ json .SBOM }}' \
            | jq -e '(keys | sort) == ["linux/amd64", "linux/arm64"]
                     and all(.[]; (.SPDX.packages | length) > 0)' > /dev/null
          echo "SPDX SBOM with packages for linux/amd64 and linux/arm64"
      - name: Sign the digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${SIGNER}" \
            --certificate-github-workflow-repository horae-dev/horae \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-sha "${GITHUB_SHA}" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "signature verified for ${IMAGE}@${DIGEST}"
      # Tags are applied last, so a tag never points at an untested or unsigned digest.
      - name: Tag the signed digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then args+=(-t "${tag}"); fi
          done <<< "${TAGS}"
          if [ "${#args[@]}" -eq 0 ]; then echo "no tags to apply" >&2; exit 1; fi
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          while IFS= read -r tag; do
            if [ -z "${tag}" ]; then continue; fi
            got="$(docker buildx imagetools inspect "${tag}" --format '{{ json .Manifest }}' | jq -r .digest)"
            if [ "${got}" != "${DIGEST}" ]; then
              echo "${tag} points at ${got}, not ${DIGEST}" >&2
              exit 1
            fi
            echo "${tag} -> ${DIGEST}"
          done <<< "${TAGS}"
