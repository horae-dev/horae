name: Release

# A `vX.Y.Z` tag publishes everything of a core release, in one run:
#   verify          the tag is plain semver, equals `__version__`, is on main, CHANGELOG.md has its
#                   section; builds the sdist and wheel with uv and extracts the release notes
#   publish         PyPI, trusted publishing (OIDC, no token) with PEP 740 attestations, in the
#                   `pypi-core` environment (required reviewer, tags `v*` only)
#   image           image.yml: adds the semver tags to the signed main image (see that file)
#   github-release  the GitHub Release, with the CHANGELOG.md section as notes and the dists
#
# Dry run: Actions > Release > Run workflow > `dry_run: true` and the tag to check. It validates
# the tag, the version and the changelog section and prints the release notes. It builds, signs
# and publishes nothing, and has no access to an environment or a token. A real release only
# ever starts from a tag push (a tag creation is restricted to admins by the "Release tags" ruleset).
#
# The `horae-sdk` package is released by release-sdk.yml (`sdk-v*` tags).
# Maintainer set-up and the release steps: docs/operations/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to check, vX.Y.Z (it does not need to exist)"
        required: true
        type: string
      dry_run:
        description: "Only validate; build, sign and publish nothing (the only mode of a manual run)"
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  UV_PYTHON_PREFERENCE: only-managed
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: 0.13.6

jobs:
  verify:
    name: Verify the tag, build, extract the notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      EVENT: ${{ github.event_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: A manual run is a dry run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          echo "a release only starts from a tag push; a manual run must have dry_run: true" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history and origin/main, for the check below
          persist-credentials: false
      - name: Check the tag, the version and the commit
        id: check
        run: |
          set -euo pipefail
          # Strict plain semver, no pre-release or build suffix (image.yml only handles these).
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "${TAG}" =~ ${re} ]]; then
            echo "the tag must look like vX.Y.Z (plain semver)" >&2
            exit 1
          fi
          version="${TAG#v}"
          found="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/horae/__init__.py)"
          if [ "${found}" != "${version}" ]; then
            echo "tag ${TAG} does not match horae ${found} (src/horae/__init__.py)" >&2
            exit 1
          fi
          if [ "${EVENT}" = "push" ]; then
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "${GITHUB_SHA} is not on main: a release tag must point at a merged commit" >&2
              exit 1
            fi
          else
            echo "dry run on ${GITHUB_REF_NAME}: the tag is not pushed, so no on-main check"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir notes
          awk -v v="## v${VERSION} " '
            index($0, v) == 1 { on = 1; next }
            /^## v/ { on = 0 }
            on { print }
          ' CHANGELOG.md > notes/RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' notes/RELEASE_NOTES.md; then
            echo "CHANGELOG.md has no section '## v${VERSION} - <date>' (run scripts/changelog.sh ${VERSION})" >&2
            exit 1
          fi
          echo "::group::Release notes"
          cat notes/RELEASE_NOTES.md
          echo "::endgroup::"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: ${{ env.DRY_RUN != 'true' }}
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # no cache in a release (cache poisoning)
      - name: Build the sdist and the wheel
        if: ${{ env.DRY_RUN != 'true' }}
        run: uv build --out-dir dist
      - name: Check the distributions
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          find dist -type f
          test "$(find dist -type f | wc -l)" -eq 2
          test -f "dist/horae-${VERSION}.tar.gz"
          test -f "dist/horae-${VERSION}-py3-none-any.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ env.DRY_RUN != 'true' }}
        with:
          name: horae-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ env.DRY_RUN != 'true' }}
        with:
          name: horae-release-notes
          path: notes/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: verify
    if: ${{ github.event_name == 'push' && github.repository == 'horae-dev/horae' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-core
      url: https://pypi.org/project/horae/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write # trusted publishing (OIDC) and attestations; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: horae-dist
          path: dist/
      # An existing file fails the job: skip-existing stays off, a re-upload must be a decision.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: false
          attestations: true

  image:
    name: Image (tag the signed digest)
    needs: verify
    if: ${{ github.event_name == 'push' && github.repository == 'horae-dev/horae' }}
    permissions:
      contents: read # checkout in the called workflow
      packages: write # add tags to ghcr.io/horae-dev/horae
    uses: ./.github/workflows/image.yml

  github-release:
    name: GitHub Release
    needs: [verify, publish, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release (nothing else)
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: horae-dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: horae-release-notes
          path: notes/
      - name: Create the release
        run: |
          set -euo pipefail
          # --verify-tag: the tag must exist (this run is its push); the release never creates one.
          gh release create "${TAG}" dist/* \
            --verify-tag \
            --title "${TAG}" \
            --notes-file notes/RELEASE_NOTES.md
