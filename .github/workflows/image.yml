name: Image release

# Release tags only. Nothing is built here: a v* tag adds the semver tags to the digest that the
# `publish` job of ci.yml already built, smoke-tested, signed and tagged `sha-<short>` for that
# commit on main. The commit must be on main and that digest must exist and carry a valid
# signature from ci.yml on main for that exact commit; otherwise the release fails.
#
# Tags applied (flavor latest=false: there is no `latest` in 0.x):
#   vX.Y.Z -> X.Y.Z and X.Y; X too, but only from 1.0 (no floating `0`).
# A tag that is not plain semver (e.g. v0.2.0rc1) yields no tags and fails.
#
# No workflow_dispatch: the only thing this workflow does is publish tags, so a dry run would
# have nothing left to do. Dispatching ci.yml on a branch is the build-and-smoke dry run.
on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/horae-dev/horae
  # The signing identity: the publish job of ci.yml on main (see docs/operations/container-image.md).
  SIGNER: https://github.com/horae-dev/horae/.github/workflows/ci.yml@refs/heads/main

jobs:
  release:
    name: Tag the signed main image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      packages: write # add tags to ghcr.io/horae-dev/horae
    env:
      # renovate: datasource=github-releases depName=sigstore/cosign
      COSIGN_VERSION: 3.1.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main and its history, for the ancestry check
          persist-credentials: false
      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main: refusing to release it" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v${{ env.COSIGN_VERSION }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the image built on main for this commit
        id: main
        run: |
          set -euo pipefail
          source_tag="${IMAGE}:sha-${GITHUB_SHA::7}"
          if ! manifest="$(docker buildx imagetools inspect "${source_tag}" --format '{{ json .Manifest }}')"; then
            echo "no ${source_tag}: main never published an image for ${GITHUB_SHA}" >&2
            echo "(wait for, or re-run, the CI workflow of that commit on main)" >&2
            exit 1
          fi
          digest="$(jq -r .digest <<< "${manifest}")"
          # The short sha could collide: the image's own revision label must be this commit.
          docker buildx imagetools inspect "${IMAGE}@${digest}" --format '{{ json .Image }}' \
            | jq -e --arg sha "${GITHUB_SHA}" \
                '(keys | sort) == ["linux/amd64", "linux/arm64"]
                 and all(.[]; .config.Labels["org.opencontainers.image.revision"] == $sha)' \
                > /dev/null
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "${source_tag} -> ${digest}"
      - name: Verify its signature
        env:
          DIGEST: ${{ steps.main.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${SIGNER}" \
            --certificate-github-workflow-repository horae-dev/horae \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-sha "${GITHUB_SHA}" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "signature verified for ${IMAGE}@${DIGEST}"
      - name: Smoke test it, and check it reports the tag's version
        env:
          DIGEST: ${{ steps.main.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${IMAGE}@${DIGEST}"
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}" scripts/smoke-image.sh "${IMAGE}@${DIGEST}" linux/amd64
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Add the release tags to the signed digest
        env:
          DIGEST: ${{ steps.main.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then args+=(-t "${tag}"); fi
          done <<< "${TAGS}"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "${GITHUB_REF_NAME} is not a plain semver tag: no image tags to apply" >&2
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          while IFS= read -r tag; do
            if [ -z "${tag}" ]; then continue; fi
            got="$(docker buildx imagetools inspect "${tag}" --format '{{ json .Manifest }}' | jq -r .digest)"
            if [ "${got}" != "${DIGEST}" ]; then
              echo "${tag} points at ${got}, not ${DIGEST}" >&2
              exit 1
            fi
            echo "${tag} -> ${DIGEST}"
          done <<< "${TAGS}"
