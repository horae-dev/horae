# Optional override: Horae behind an existing Traefik (v2 or v3) and an SSO forwardAuth
# (#41, docs/operations/compose.md). Use it with the base file:
#
#   docker compose -f docker-compose.yaml -f traefik.yaml up -d
#
# Routing: the `horae` router (the whole host: `/runs`, `/healthz`, everything) goes through
# the `horae-sso` forwardAuth middleware; `horae-act` (`PathPrefix(/act/)`, a higher priority)
# is the only router without it. Horae joins HORAE_PROXY_NETWORK, a network shared ONLY with
# Traefik (create it yourself, see the guide): any container on Horae's networks can reach port
# 8080 and send any Host (schemas decision 51 B, docs/security.md T15).
# Tested against the rendered files: tests/test_deploy_templates.py.

services:
  horae:
    environment:
      HORAE_ALLOWED_HOSTS: "${HORAE_PUBLIC_HOST:?set HORAE_PUBLIC_HOST to the public host name}"
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${HORAE_PROXY_NETWORK:-horae-proxy}"
      - "traefik.http.middlewares.horae-sso.forwardauth.address=${HORAE_SSO_FORWARD_AUTH_URL:?set HORAE_SSO_FORWARD_AUTH_URL to the SSO forwardAuth address}"
      - "traefik.http.middlewares.horae-sso.forwardauth.trustForwardHeader=true"
      - "traefik.http.services.horae.loadbalancer.server.port=8080"
      - "traefik.http.routers.horae.rule=Host(`${HORAE_PUBLIC_HOST:?set HORAE_PUBLIC_HOST to the public host name}`)"
      - "traefik.http.routers.horae.entryPoints=${HORAE_TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.horae.tls=true"
      - "traefik.http.routers.horae.tls.certresolver=${HORAE_TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.horae.middlewares=horae-sso"
      - "traefik.http.routers.horae.service=horae"
      - "traefik.http.routers.horae-act.rule=Host(`${HORAE_PUBLIC_HOST:?set HORAE_PUBLIC_HOST to the public host name}`) && PathPrefix(`/act/`)"
      - "traefik.http.routers.horae-act.entryPoints=${HORAE_TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.horae-act.priority=1000"
      - "traefik.http.routers.horae-act.tls=true"
      - "traefik.http.routers.horae-act.tls.certresolver=${HORAE_TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.horae-act.service=horae"

networks:
  proxy:
    external: true
    name: "${HORAE_PROXY_NETWORK:-horae-proxy}"
