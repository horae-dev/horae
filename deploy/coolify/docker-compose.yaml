# documentation: https://github.com/horae-dev/horae/blob/main/docs/operations/coolify.md
# slogan: Horae, a predictable self-hosted personal agent (scheduler and read-only HTTP API).
# category: automation
# tags: horae,agent,assistant,scheduler,automation,obsidian
# port: 8080
#
# Coolify "Docker Compose Empty" service template (#41). Install guide, prerequisites and what
# to verify: docs/operations/coolify.md. The layout is the reference deployment's: public
# traffic arrives through a Cloudflare Tunnel (cloudflared) on Traefik's `http` entry point
# (Cloudflare terminates TLS), the routers are the labels below (Coolify generates none), and
# SSO is a forwardAuth middleware that Traefik's dynamic FILE configuration defines once for
# every app (`authentik@file`), with the authentik outpost as a file service (`sso@file`).
# In short:
#   - leave the Domains of both services EMPTY: a domain makes Coolify generate routers of its
#     own, without SSO (on the public host they still lose to the routers below, by priority;
#     on any other host they are open). The public host is HORAE_PUBLIC_HOST.
#   - turn OFF "Escape special characters in labels" (Edit Compose), or the labels' variables
#     stay literal: no router matches, nothing is served (fails closed, nothing works)
#   - every variable written ${VAR:?} is required: Coolify blocks the deployment until it is
#     set. No text after `:?`: Coolify would store that text as the value.
#   - the shared middleware and outpost service must exist in Traefik's file configuration;
#     a router naming a missing middleware is refused by Traefik (fails closed)
#   - HORAE_TRAEFIK_NETWORK (default `traefik-network`, the reference deployment's) is the
#     network Traefik reaches Horae on. Every container on it can call port 8080 WITHOUT SSO
#     (docs/security.md T15, schemas decision 51 B): prefer a network shared only by Horae and
#     the proxy (docs/operations/coolify.md, "The proxy network").
#   - HORAE_TRAEFIK_NAME (default `horae`) prefixes the router names: unique per Horae on the
#     server. Two copies with the same name clash, and Traefik drops the clashing routers (fails
#     closed, nothing served).
#
# Routing (only `/act/` is exempt from SSO), all on HORAE_TRAEFIK_ENTRYPOINT:
#   - `<name>`: Host(HORAE_PUBLIC_HOST), the whole host, through HORAE_SSO_MIDDLEWARE.
#   - `<name>-act`: the same host and PathPrefix(/act/), no middleware, a higher priority.
#   - `<name>-outpost`: the same host and PathPrefix(/outpost.goauthentik.io/), to the SSO
#     outpost (HORAE_SSO_OUTPOST_SERVICE), never to Horae: the sign-in callback.
# Tested against the rendered file: tests/test_deploy_templates.py.

# The image, in ONE place: the default tag is bumped here (docs/operations/container-image.md,
# "Bumping the deploy templates"). Set HORAE_IMAGE_TAG to override it, `<tag>@sha256:<digest>`
# to pin the digest too (docs/operations/coolify.md, Updates).
x-horae-image: &horae-image "ghcr.io/horae-dev/horae:${HORAE_IMAGE_TAG:-sha-aadf1e0}"

services:
  # One-off: creates the example instance in a new, empty volume (`horae init`), then exits.
  # An instance already there (horae.yaml present) is left alone; a non-empty volume without
  # horae.yaml is refused by `horae init` (exit 3) and `horae` does not start.
  horae-init:
    image: *horae-image
    entrypoint: ["sh", "-c"]
    command: ["test -e /instance/horae.yaml || exec horae init /instance"]
    # `restart: "no"` also keeps this one-off out of the stack's health (Coolify).
    restart: "no"
    user: "10001:10001"
    read_only: true
    # Nothing is ever executed from /tmp (the image's HOME and TMPDIR): noexec.
    tmpfs:
      - "/tmp:size=64m,noexec,nosuid,nodev"
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - horae-instance:/instance

  horae:
    # Pinned tag (a `sha-<short>` of main, or a release `X.Y.Z` once there is one).
    image: *horae-image
    # The image's command (`horae serve`), user, tini (PID 1) and HEALTHCHECK (/healthz over
    # loopback) are kept: no `command`, no `init`, no `healthcheck` here.
    depends_on:
      horae-init:
        condition: service_completed_successfully
    environment:
      - HORAE_ALLOWED_HOSTS=${HORAE_PUBLIC_HOST:?} # the public host name (the tunnel's): anything else is 400 invalid_host
      - HORAE_SCHEDULER=${HORAE_SCHEDULER:-external} # external: Coolify Scheduled Tasks run `horae run <pipeline>`
      - HORAE_ANTHROPIC_API_KEY=${HORAE_ANTHROPIC_API_KEY:?} # read by horae.yaml secrets.refs {env: HORAE_ANTHROPIC_API_KEY}
      - HORAE_MONITOR_DAILY_BRIEF_URL=${HORAE_MONITOR_DAILY_BRIEF_URL:?} # Uptime Kuma push URL of daily-brief (a secret)
      - HORAE_MONITOR_REMIND_URL=${HORAE_MONITOR_REMIND_URL:?} # Uptime Kuma push URL of remind (a secret)
    user: "10001:10001"
    read_only: true
    # Nothing is ever executed from /tmp (the image's HOME and TMPDIR): noexec.
    tmpfs:
      - "/tmp:size=64m,noexec,nosuid,nodev"
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # SIGTERM: in-progress runs are saved and pinged before exit (schemas decision 49 E2).
    stop_grace_period: 30s
    volumes:
      - horae-instance:/instance
    # No `ports`: the proxy reaches port 8080 on HORAE_TRAEFIK_NETWORK. `default` is this
    # resource's own network (Coolify adds its per-resource network as well).
    networks:
      - default
      - proxy
    # Routers only, no middleware defined here: SSO is the file provider's middleware, named
    # by HORAE_SSO_MIDDLEWARE (never empty: `:-` also replaces an empty value). Its
    # `trustForwardHeader: true` is safe only while no entry point trusts the forwarded
    # headers of the peer that reaches it (cloudflared): docs/operations/coolify.md.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${HORAE_TRAEFIK_NETWORK:-traefik-network}"
      - "traefik.http.services.${HORAE_TRAEFIK_NAME:-horae}.loadbalancer.server.port=8080"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}.rule=Host(`${HORAE_PUBLIC_HOST:?}`)"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}.entryPoints=${HORAE_TRAEFIK_ENTRYPOINT:-http}"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}.tls=${HORAE_TRAEFIK_TLS:-false}"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}.priority=900"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}.middlewares=${HORAE_SSO_MIDDLEWARE:-authentik@file}"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}.service=${HORAE_TRAEFIK_NAME:-horae}"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}-act.rule=Host(`${HORAE_PUBLIC_HOST:?}`) && PathPrefix(`/act/`)"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}-act.entryPoints=${HORAE_TRAEFIK_ENTRYPOINT:-http}"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}-act.tls=${HORAE_TRAEFIK_TLS:-false}"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}-act.priority=1000"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}-act.service=${HORAE_TRAEFIK_NAME:-horae}"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}-outpost.rule=Host(`${HORAE_PUBLIC_HOST:?}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}-outpost.entryPoints=${HORAE_TRAEFIK_ENTRYPOINT:-http}"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}-outpost.tls=${HORAE_TRAEFIK_TLS:-false}"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}-outpost.priority=1000"
      - "traefik.http.routers.${HORAE_TRAEFIK_NAME:-horae}-outpost.service=${HORAE_SSO_OUTPOST_SERVICE:-sso@file}"

# The network Traefik reaches Horae on, created outside this resource (`traefik-network` in the
# reference deployment). Coolify prefixes the volume's name with the resource's UUID.
networks:
  proxy:
    external: true
    name: "${HORAE_TRAEFIK_NETWORK:-traefik-network}"

volumes:
  horae-instance:
