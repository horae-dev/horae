# horae.yaml of a home-server instance (synthetic).
timezone: Europe/Paris
state_dir: /data/state
models:
  default: { backend: anthropic, model: claude-sonnet-4-5, secret: ANTHROPIC_API_KEY }
  personal: { backend: claude-cli, model: sonnet }
  router:
    backend: openai-compatible
    model: mistral-small
    base_url: https://openrouter.example.org/api/v1
    secret: OPENROUTER_API_KEY
plugins:
  github: { call_timeout_s: 20 }
secrets:
  dir: /run/secrets
  refs:
    ANTHROPIC_API_KEY: { file: anthropic_api_key }
    OPENROUTER_API_KEY: { env: OPENROUTER_KEY }
scheduler: { mode: external }
