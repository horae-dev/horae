# horae.yaml of a home-server instance (synthetic).
schema_version: 1
timezone: Europe/Paris
state_dir: /data/state
models:
  default: { backend: anthropic, model: claude-sonnet-4-5, secret: ANTHROPIC_API_KEY }
  personal: { backend: claude-cli, model: sonnet }
  # `price` (USD per million tokens) gives each call a cost; the numbers here are synthetic,
  # use the ones you pay. Without it a call costs `usd: 0` (`priced: false`).
  priced:
    backend: anthropic
    model: claude-haiku-4-5
    secret: ANTHROPIC_API_KEY
    price: { input_per_mtok: 1.5, output_per_mtok: 7.5, cache_read_per_mtok: 0.15 }
    # Optional cap on `max_tokens` for every call of the alias, below the step's `tokens_out`.
    max_output_tokens: 4096
  router:
    backend: openai-compatible
    model: mistral-small
    base_url: https://openrouter.example.org/api/v1
    secret: OPENROUTER_API_KEY
  # A local vLLM without JSON Schema support: `structured_output` (openai-compatible only)
  # falls back to `json_object` (or `none`); `base_url` includes the `/v1` prefix. No key.
  vllm:
    backend: openai-compatible
    model: qwen
    base_url: "http://vllm:8000/v1"
    structured_output: json_object
    # On the LAN: no de-identification, no price expected (#34; never inferred from base_url).
    local: true
  # http to a single-label host: the `ollama` service of the same Compose project.
  local: { backend: ollama, model: llama3, base_url: "http://ollama:11434" }
plugin_defaults:
  startup_timeout_s: 10
  call_timeout_s: 30
  runtime: process
  # Container limits (decision 78 D); these are the defaults.
  limits: { cpus: 1.0, memory_mb: 512, pids: 128, tmp_mb: 64, nofile: 1024 }
plugins:
  # Each field of a plugin's own `limits` wins over plugin_defaults.limits.
  github: { call_timeout_s: 20, runtime: container, limits: { memory_mb: 1024 } }
container:
  image: python:3.12-slim-bookworm@sha256:e697c81897302a4c4333bade000d98038fbb21eb064f8ee1fd42d02ebcd9d337
  docker: /usr/bin/docker
  # Declared plugin paths may also come from here (decision 78 B), besides the instance.
  mount_roots: [/srv/vault]
secrets:
  dir: /run/secrets
  refs:
    ANTHROPIC_API_KEY: { file: anthropic_api_key }
    OPENROUTER_API_KEY: { env: OPENROUTER_KEY }
# `horae run` is called by Coolify Scheduled Tasks (`HORAE_SCHEDULER` overrides the mode). Each
# run of `daily-brief` pings a push monitor whose URL (it carries a token) is a secret file.
scheduler:
  mode: external
  monitors:
    daily-brief: { secret: DAILY_BRIEF_PUSH_URL }
    remind: { secret: REMIND_PUSH_URL, kind: healthchecks }
  # Used by `horae serve` in builtin mode: one scheduled run at a time, skipped if 1 h late.
  max_concurrent: 1
  misfire_grace_s: 3600
runs: { timeout_s: 1200 }
# Daily LLM spend ceilings across runs, in the instance's time zone (decision 41).
budgets:
  daily: { usd: 2.0, tokens_out: 200000 }
  pipelines:
    daily-brief: { daily: { usd: 0.5 } }
# The LLM cache: accepted outputs reused on unchanged input for a day (decision 45).
cache: { ttl_s: 86400, max_entries: 500 }
# De-identification before a cloud model (#34): known names, one `class: term` per line, in a
# file of `secrets.dir` (personal data: never in the instance repository).
deidentification: { vocabulary: deid_vocabulary }
# The HTTP API behind the reverse proxy (#38): the base of the `/act` links in notification
# buttons, and the proxies whose X-Forwarded-For the `/act` rate limit trusts (here the
# Docker network shared by Traefik and cloudflared).
http:
  public_url: https://horae.example.org
  trusted_proxies: [172.18.0.0/16]
# Marketplace indexes (#43), highest priority first; any https git URL. Default: only
# horae-dev/marketplace. A plugin that two of them list under different repositories needs a
# pin to one of them.
marketplaces:
  - https://github.com/horae-dev/marketplace
  - https://git.example.org/team/marketplace
marketplace_pins:
  coach: https://git.example.org/team/marketplace
